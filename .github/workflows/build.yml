name: Build 7kimisu Manager
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup Temurin JDK21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Android SDK & NDK r29
        uses: android-actions/setup-android@v3
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          target: aarch64-linux-android
      - name: Build ksud
        run: |
          cd userspace/ksud
          cargo build --target aarch64-linux-android --release -p ksud
      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > sign.jks
      - name: Build Manager APK
        env:
          PKEYSTORE_FILE: sign.jks
          PKEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PKEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PKEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd manager
          ./gradlew :app:assembleRelease \
            -PPREBUILT_NATIVE=1 \
            -PKSU_NAME=7kimisu \
            -PKSU_VERSION_CODE=32649 \
            -PKSU_VERSION_NAME=7kimisu-v1.0.0 \
            -PKEYSTORE_FILE=${PKEYSTORE_FILE} \
            -PKEYSTORE_PASSWORD=${PKEYSTORE_PASSWORD} \
            -PKEY_ALIAS=${PKEY_ALIAS} \
            -PKEY_PASSWORD=${PKEY_PASSWORD}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 7kimisu-apk
          path: manager/app/build/outputs/apk/release/app-release.apk
